<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Impact: 2.5+ years, 6+ banks and insurers, 6 production apps, 13+ transform types"><title>Impact: 2.5+ years, 6+ banks and insurers, 6 production apps, 13+ transform types</title><defs>
